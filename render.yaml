services:
  - type: web
    name: sekora-api
    runtime: docker
    plan: free
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    healthCheckPath: /health/
    preDeployCommand: python manage.py migrate

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sekora-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sekora-redis
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: FRONTEND_URL
        sync: false

      - key: CLOUDINARY_URL
        sync: false

  - type: keyvalue
    name: sekora-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow Render services

databases:
  - name: sekora-db
    plan: free
    databaseName: sekora
    user: sekora